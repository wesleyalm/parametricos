<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MWfix | Gerador de chaveiros</title><style>*{box-sizing:border-box}body{margin:0;background:#171717;color:#eee;font:15px system-ui}header{padding:18px 24px;background:#222;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333}b{color:#ff7900;font-size:26px}main{display:grid;grid-template-columns:350px 1fr;min-height:85vh}aside{padding:18px;background:#232323;overflow:auto}label{display:block;margin:12px 0 5px;color:#ccc}input,select,textarea,button{font:inherit;border:1px solid #444;border-radius:6px;padding:10px;background:#303030;color:#fff;width:100%}textarea{height:110px;resize:vertical}button{cursor:pointer;margin-top:10px;background:#ff7900;color:#111;font-weight:bold;border:0}button.secondary{background:#393939;color:white}section{padding:20px;min-width:0}canvas{width:100%;height:65vh;background:#202020;border-radius:10px;touch-action:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}small{color:#aaa}#status{margin:12px 0}@media(max-width:760px){main{grid-template-columns:1fr}canvas{height:50vh}}</style><header><div><b>MWfix</b> | Gerador de chaveiros</div><small>Produção em lote</small></header><main><aside><label>Nomes (vírgula ou uma linha por nome)</label><textarea id="names">Emma</textarea><button class="secondary" id="add">+ Adicionar nome</button><label>Fonte instalada no OpenSCAD</label><select id="font"><option>Pacifico</option><option>Aladin</option><option>Archivo Black</option><option>Bangers</option><option>Bungee</option><option>Bebas Neue</option><option>Changa One</option><option>Chewy</option><option>Cookie</option><option>Courgette</option><option>Dancing Script</option><option>Lemon</option><option>Lobster</option><option>Noto Sans</option><option>Playfair Display</option><option>Poppins Black</option><option>Press Start 2P</option><option>Audiowide</option><option>DynaPuff</option><option>Lily Script One</option></select><div class="pair"><div><label>Tamanho (mm)</label><input id="size" type="number" min="5" max="50" value="16"></div><div><label>Texto (mm)</label><input id="th" type="number" min="0.2" step="0.2" value="2"></div><div><label>Base (mm)</label><input id="bh" type="number" min="0.2" step="0.2" value="3"></div><div><label>Contorno (mm)</label><input id="border" type="number" min="0.5" step="0.1" value="2"></div><div><label>Argola (mm)</label><input id="ring" type="number" min="-20" max="10" step="0.5" value="0"></div><div><label>Espaço (mm)</label><input id="gap" type="number" min="2" value="5"></div><div><label>Cor da base</label><input id="bc" type="color" value="#000000"></div><div><label>Cor do texto</label><input id="tc" type="color" value="#40e0d0"></div></div><label>Mesa</label><select id="bed"><option value="256">Bambu A1 — 256 mm</option><option value="180">Bambu A1 Mini — 180 mm</option></select><button id="generate">Gerar prévia</button><label>Exportar</label><select id="part"><option value="both">Modelo completo</option><option value="base">Somente bases</option><option value="text">Somente textos</option></select><button id="download">Baixar OpenSCAD (.scad)</button><button class="secondary" id="individual">Baixar nomes individualmente (.zip)</button><p><small>Prévia ilustrativa 2D. A geometria final e a exportação STL são feitas no OpenSCAD.</small></p></aside><section><div id="status"></div><canvas id="view"></canvas><p><small>As dimensões da prévia são aproximadas. Confira a posição da argola e o encaixe na mesa no OpenSCAD antes de imprimir.</small></p></section></main><script>
const $=id=>document.getElementById(id);function config(){let n=$('names').value.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);let c={n,font:$('font').value, size:+$('size').value,th:+$('th').value,bh:+$('bh').value,border:+$('border').value,ring:+$('ring').value,gap:+$('gap').value,bed:+$('bed').value,bc:$('bc').value,tc:$('tc').value};if(!n.length||['size','th','bh','border','gap'].some(k=>!Number.isFinite(c[k])||c[k]<=0)||!Number.isFinite(c.ring))throw Error('Preencha os nomes e as dimensões válidas.');return c}
function draw(){try{let c=config(),v=$('view'),d=devicePixelRatio||1;v.width=v.clientWidth*d;v.height=v.clientHeight*d;let g=v.getContext('2d');g.scale(d,d);let w=v.clientWidth,h=v.clientHeight,k=Math.min((w-50)/c.bed,(h-50)/c.bed);g.translate((w-c.bed*k)/2,(h-c.bed*k)/2);g.scale(k,k);g.fillStyle='#404040';g.fillRect(0,0,c.bed,c.bed);g.strokeStyle='#4d4d4d';g.lineWidth=.2;for(let i=0;i<c.bed;i+=10){g.beginPath();g.moveTo(i,0);g.lineTo(i,c.bed);g.moveTo(0,i);g.lineTo(c.bed,i);g.stroke()}g.font=`${c.size*1.25}px '${c.font}', cursive`;g.textBaseline='alphabetic';let x=5,y=5,row=0,count=0,overflow=false;for(let n of c.n){let a=g.measureText(n).width+2*c.border+12+Math.abs(c.ring),b=c.size*1.6+2*c.border;if(x+a>c.bed-5){x=5;y+=row+c.gap;row=0}if(y+b>c.bed-5||a>c.bed-10){overflow=true;break}let tx=x+10+Math.abs(c.ring)+c.border,ty=y+c.size*1.25;g.lineJoin='round';g.strokeStyle=c.bc;g.lineWidth=c.border*2;g.strokeText(n,tx,ty);g.fillStyle=c.bc;g.beginPath();g.arc(tx-3+c.ring,ty-c.size/2,4,0,Math.PI*2);g.fill();g.fillStyle=c.tc;g.fillText(n,tx,ty);g.fillStyle='#404040';g.beginPath();g.arc(tx-3+c.ring,ty-c.size/2,2,0,Math.PI*2);g.fill();x+=a+c.gap;row=Math.max(row,b);count++}$('status').textContent=`${c.n.length} chaveiro(s) • ${count} na prévia da mesa${overflow?' • restante exige outra mesa ou ajuste':''}`;}catch(e){$('status').textContent=e.message}}
const q=s=>JSON.stringify(s);function scad(c,part,names=c.n){return `// MWfix — gerador paramétrico independente\n// OpenSCAD 2021+ (textmetrics requer versão com suporte; layout usa estimativa)\n$fn=100;\nnames=${JSON.stringify(names)};\nfont=${q(c.font)};\ns=${c.size}; bh=${c.bh}; th=${c.th}; border=${c.border}; ring=${c.ring}; gap=${c.gap}; bed=${c.bed};\npart=${q(part)};\n// Espaçamento conservador; ajuste se necessário para a fonte escolhida.\nfunction width(n)=max(25,len(n)*s*1.6+2*border+20+abs(ring));\nstep_y=s*2.2+2*border+gap;\nfunction places(i=0,x=5,y=5,p=0)=i>=len(names)?[]:let(w=width(names[i]),nx=x+w>bed-5?5:x,ny=x+w>bed-5?y+step_y:y,np=ny+step_y>bed? p+1:p,fy=np>p?5:ny)concat([[nx,fy,np]],places(i+1,nx+w+gap,fy,np));\npositions=places();\nplate=0; // altere para exportar as demais mesas\nmodule glyph(n){text(n,size=s,font=font);}\nmodule backing(n){difference(){union(){offset(r=border)glyph(n);hull(){translate([-3+ring,s/2])circle(r=4);translate([2,s/2])circle(r=4);}}translate([-3+ring,s/2])circle(r=2);}}\nmodule key(n){if(part!="text")color(${q(c.bc)})linear_extrude(bh)backing(n);if(part!="base")color(${q(c.tc)})translate([0,0,bh])linear_extrude(th)glyph(n);}\nfor(i=[0:len(names)-1])if(positions[i][2]==plate)translate([positions[i][0]+10+abs(ring),positions[i][1]+border+s/2,0])key(names[i]);\necho("Mesas",positions[len(positions)-1][2]+1);\n`}
function save(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('download').onclick=()=>{try{save('mwfix-chaveiros.scad',new Blob([scad(config(),$('part').value)],{type:'text/plain'}))}catch(e){alert(e.message)}};
// ZIP sem compressão, sem dependências externas.
function zip(files){let enc=new TextEncoder(),chunks=[],central=[],offset=0;const crc=a=>{let c=-1;for(let b of a){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^-1)>>>0};function hdr(n){let a=new Uint8Array(n),v=new DataView(a.buffer);return [a,(o,x)=>v.setUint16(o,x,true),(o,x)=>v.setUint32(o,x,true)]}for(let [name,body] of files){let n=enc.encode(name),b=enc.encode(body),r=crc(b),[a,s,l]=hdr(30);l(0,0x04034b50);s(4,20);s(6,2048);l(14,r);l(18,b.length);l(22,b.length);s(26,n.length);chunks.push(a,n,b);let [z,t,m]=hdr(46);m(0,0x02014b50);t(4,20);t(6,20);t(8,2048);m(16,r);m(20,b.length);m(24,b.length);t(28,n.length);m(42,offset);central.push(z,n);offset+=a.length+n.length+b.length}let [e,s,l]=hdr(22);l(0,0x06054b50);s(8,files.length);s(10,files.length);l(12,central.reduce((a,b)=>a+b.length,0));l(16,offset);return new Blob([...chunks,...central,e],{type:'application/zip'})}
$('individual').onclick=()=>{try{let c=config();save('mwfix-individuais.zip',zip(c.n.map((n,i)=>[`${i+1}-${n.replace(/[^\p{L}\p{N}_-]/gu,'_')}.scad`,scad(c,$('part').value,[n])])))}catch(e){alert(e.message)}};$('add').onclick=()=>{$('names').value+='\n';$('names').focus()};$('generate').onclick=draw;document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('change',draw));window.addEventListener('resize',draw);draw();</script></html>
