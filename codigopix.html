function criarSvgEstiloExato(payload) {
            const qr = qrcode(0, 'M');
            qr.addData(payload);
            qr.make();

            const moduleCount = qr.getModuleCount();
            const margin = 2;
            const size = moduleCount + (margin * 2);
            
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="200" height="200" style="display:block;">`;
            
            // Fundo branco total
            svgContent += `<rect width="${size}" height="${size}" rx="1.5" fill="#ffffff"/>`;

            function isFinderPattern(r, c) {
                return (r < 7 && c < 7) || (r < 7 && c >= moduleCount - 7) || (r >= moduleCount - 7 && c < 7);
            }

            for (let row = 0; row < moduleCount; row++) {
                for (let col = 0; col < moduleCount; col++) {
                    if (qr.isDark(row, col)) {
                        const x = col + margin;
                        const y = row + margin;

                        if (isFinderPattern(row, col)) {
                            svgContent += `<rect x="${x}" y="${y}" width="1" height="1" fill="#000000"/>`;
                        } else {
                            // Usamos 1.05 de largura/altura para os blocos se unirem, e um arredondamento sutil de 0.15
                            svgContent += `<rect x="${x - 0.025}" y="${y - 0.025}" width="1.05" height="1.05" rx="0.15" ry="0.15" fill="#000000"/>`;
                        }
                    }
                }
            }
            svgContent += `</svg>`;
            return svgContent;
        }
